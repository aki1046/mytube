
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #181818;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  white-space: nowrap;
}

.logo span { color: red; }

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.search {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 7px;
  background: #252525;
  color: white;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 12px 17px;
  background: #ff3333;
  color: white;
  cursor: pointer;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.tabs button {
  background: #333;
}

.tabs button.active {
  background: #ff3333;
}

.player {
  width: 100%;
  aspect-ratio: 16/9;
  background: #222;
  border-radius: 12px;
  overflow: hidden;
  margin-top: 15px;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

#favorites {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
  gap: 15px;
}

.item {
  background: #202020;
  border-radius: 10px;
  padding: 12px;
}

.item button {
  margin-top: 8px;
  background: #333;
}

.message {
  color: #aaa;
  line-height: 1.8;
}

@media(max-width:600px) {
  header { padding: 14px; }
  .logo { font-size: 21px; }
  main { padding: 12px; }
  .search button { padding: 10px; }
}
</style>
</head>
<body>

<header>
  <div class="logo"><span>▶</span> MyTube</div>
</header>

<main>
  <h2>YouTubeを楽しもう！</h2>

  <div class="search">
    <input id="url" placeholder="YouTubeのURLを入力">
    <button onclick="play()">再生</button>
  </div>

  <div class="player">
    <iframe
      id="video"
      src=""
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <p id="title" class="message">
    YouTubeのURLを入力すると動画を再生できます。
  </p>

  <button onclick="saveFavorite()">❤️ お気に入り登録</button>

  <div class="tabs">
    <button id="homeTab" class="active" onclick="showPage('home')">ホーム</button>
    <button id="favTab" onclick="showPage('favorites')">お気に入り</button>
  </div>

  <section id="home">
    <h3>動画を見る</h3>
    <p class="message">
      YouTubeの動画URLを上の検索欄に入力してください。
    </p>
  </section>

  <section id="favorites" hidden>
    <h3>お気に入り動画</h3>
    <div id="favList"></div>
  </section>
</main>

<script>
let currentId = "";

function getVideoId(url) {
  try {
    const u = new URL(url);

    if (u.hostname === "youtu.be" ||
        u.hostname === "www.youtu.be") {
      return u.pathname.split("/")[1];
    }

    if (u.hostname === "youtube.com" ||
        u.hostname.endsWith(".youtube.com")) {
      if (u.pathname === "/watch") {
        return u.searchParams.get("v");
      }

      const parts = u.pathname.split("/");
      if (["embed", "shorts", "live"].includes(parts[1])) {
        return parts[2];
      }
    }
  } catch(e) {}

  return null;
}

function play() {
  const input = document.getElementById("url").value.trim();
  const id = getVideoId(input);

  if (!id || !/^[a-zA-Z0-9_-]{11}$/.test(id)) {
    alert("正しいYouTube動画URLを入力してください。");
    return;
  }

  currentId = id;

  document.getElementById("video").src =
    "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(id);

  document.getElementById("title").textContent =
    "動画を再生中です！";

  showPage("home");
}

function getFavorites() {
  try {
    return JSON.parse(
      localStorage.getItem("mytube_favorites") || "[]"
    );
  } catch(e) {
    return [];
  }
}

function saveFavorite() {
  if (!currentId) {
    alert("先に動画を再生してください。");
    return;
  }

  let list = getFavorites();

  if (list.includes(currentId)) {
    alert("登録済みのお気に入りです！");
    return;
  }

  list.push(currentId);
  localStorage.setItem(
    "mytube_favorites",
    JSON.stringify(list)
  );

  renderFavorites();
  alert("お気に入りに登録しました！");
}

function renderFavorites() {
  const container = document.getElementById("favList");
  container.innerHTML = "";

  const list = getFavorites();

  if (list.length === 0) {
    container.textContent = "お気に入りはまだありません。";
    return;
  }

  list.forEach(id => {
    const item = document.createElement("div");
    item.className = "item";

    const image = document.createElement("img");
    image.src = "https://img.youtube.com/vi/" +
      encodeURIComponent(id) + "/mqdefault.jpg";
    image.alt = "動画サムネイル";
    image.style.width = "100%";

    const playButton = document.createElement("button");
    playButton.textContent = "▶ 再生";
    playButton.onclick = () => {
      document.getElementById("url").value =
        "https://www.youtube.com/watch?v=" + id;
      play();
    };

    const removeButton = document.createElement("button");
    removeButton.textContent = "削除";
    removeButton.onclick = () => {
      localStorage.setItem(
        "mytube_favorites",
        JSON.stringify(getFavorites().filter(x => x !== id))
      );
      renderFavorites();
    };

    item.append(image, playButton, removeButton);
    container.append(item);
  });
}

function showPage(page) {
  document.getElementById("home").hidden = page !== "home";
  document.getElementById("favorites").hidden = page !== "favorites";

  document.getElementById("homeTab").classList.toggle(
    "active", page === "home"
  );
  document.getElementById("favTab").classList.toggle(
    "active", page === "favorites"
  );

  if (page === "favorites") renderFavorites();
}

renderFavorites();
</script>

</body>
</html>
